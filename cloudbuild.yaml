substitutions:
  _REGION: us-central1
  _JOB_NAME: cpr-gcs-to-bigquery
  _REPOSITORY: cpr-images

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/cpr-ingestion:$COMMIT_SHA
      - ./batch

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - ${_JOB_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/cpr-ingestion:$COMMIT_SHA
      - --region=${_REGION}
      - --project=$PROJECT_ID

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/cpr-ingestion:$COMMIT_SHA